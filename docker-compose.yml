services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: needbridge
    ports:
      - "3306:3306"
    volumes:
      - needbridge_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/needbridge?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      JWT_SECRET: NeedBridgeDockerJwtSecretKeyMustBeAtLeastThirtyTwoCharactersLong2026
      DEMO_SEED: "true"
    ports:
      - "8080:8080"

volumes:
  needbridge_mysql:
